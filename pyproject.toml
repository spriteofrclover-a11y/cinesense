[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinesense"
version = "0.1.0"
description = "Hybrid AI movie recommendation engine with explainable results"
requires-python = ">=3.12"

# Runtime only. Anything imported by the API must be listed here, and nothing
# here may appear in requirements-dev.txt's heavy block.
dependencies = [
    "fastapi>=0.115,<1.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.7,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cinesense = [
    "serving/static/*.html",
    "serving/static/*.svg",
    "serving/static/css/*.css",
    "serving/static/js/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
