<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineSense — find the film you did not know you wanted</title>
  <meta name="description" content="A hybrid movie recommender: collaborative filtering, content similarity and your own ratings, with a reason attached to every suggestion.">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="CineSense home">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="7.2" r="1.5" fill="currentColor"/>
          <circle cx="12" cy="16.8" r="1.5" fill="currentColor"/>
          <circle cx="7.2" cy="12" r="1.5" fill="currentColor"/>
          <circle cx="16.8" cy="12" r="1.5" fill="currentColor"/>
        </svg>
        <span>CineSense</span>
      </a>

      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="discover">Discover</a>
        <a href="#/taste" data-nav="taste">Your taste</a>
        <a href="#/about" data-nav="about">How it works</a>
      </nav>

      <form class="searchbox" role="search" autocomplete="off">
        <label class="sr-only" for="search">Search films</label>
        <input id="search" name="q" type="search" placeholder="Search films" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="search-results">
        <div id="search-results" class="search-results" role="listbox" aria-label="Search results" hidden></div>
      </form>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-inner">
      <p>CineSense · datasets from <a href="https://grouplens.org/datasets/movielens/" rel="noopener">MovieLens</a>.
         Poster images courtesy of TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
      <p class="footer-fine">Ratings stay in your browser. Nothing about you is stored on the server.</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
